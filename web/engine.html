<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>PVSSPW · 游玩</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/ui/engine.css" />
    <script src="/__bench/probe.js"></script>
    <script type="module" src="/ui/engine.js"></script>
  </head>
  <body>
    <section id="player" hidden>
      <div id="stage">
        <canvas id="screen" width="960" height="544" aria-label="游戏画面"></canvas>
        <canvas id="softwareScreen" hidden aria-hidden="true"></canvas>
        <div id="fpsbadge" hidden></div>
        <button id="mutebtn" type="button" aria-label="切换静音">♫</button
        ><button id="menubtn" type="button" aria-label="游玩菜单">☰</button>
      </div>
      <div id="pad"></div>
      <div id="loading">
        <section class="work-card loading-in">
          <header><img src="/ui/brand.svg" alt="" /><b>正在启动游戏</b></header>
          <h2 id="loading-title"></h2>
          <progress aria-label="启动中"></progress>
          <details>
            <summary>启动日志</summary>
            <p id="loading-status"></p>
          </details>
        </section>
      </div>
      <div id="menu" hidden>
        <section id="m-confirm" class="work-card menu-in" hidden>
          <header><img src="/ui/brand.svg" alt="" /><b>确认操作</b></header>
          <p id="m-confirm-text"></p>
          <div class="menu-row">
            <button id="m-confirm-no">取消</button
            ><button id="m-confirm-yes" class="primary">确认</button>
          </div>
        </section>
        <section id="m-body" class="work-card menu-in">
          <header><img src="/ui/brand.svg" alt="" /><b>游玩菜单</b></header>
          <h2 id="m-title"></h2>
          <div class="menu-row">
            <button id="m-resume" class="primary">继续游戏</button
            ><button id="m-fullscreen">全屏游玩</button><button id="m-shot">保存截图</button>
          </div>
          <section class="menu-controls">
            <h3>声音与操作</h3>
            <label><input id="m-mute" type="checkbox" />静音</label
            ><label><input id="m-fps" type="checkbox" />显示核心帧率</label
            ><label><input id="m-pause-blur" type="checkbox" />失去焦点时暂停</label
            ><label><input id="m-rear" type="checkbox" />后触摸板</label>
            <label class="wide"
              >屏幕手柄<select id="m-pad-mode">
                <option value="auto">触屏时显示</option>
                <option value="overlay">覆盖画面</option>
                <option value="beside">置于画面旁</option>
                <option value="hidden">隐藏</option>
              </select></label
            ><label class="wide"
              >手柄不透明度<input id="m-pad-opacity" type="range" min="0.1" max="1" step="0.05"
            /></label>
          </section>
          <div id="m-vita" hidden></div>
          <div class="menu-row">
            <a id="m-settings" href="#/settings">画质与按键设置</a
            ><button id="m-restart">重新开始</button><button id="m-quit">退出到游戏库</button>
          </div>
          <details>
            <summary>核心诊断</summary>
            <div class="menu-row">
              <button id="m-copy">复制诊断</button><button id="m-download">下载诊断</button>
            </div>
            <pre id="m-diag"></pre>
          </details>
        </section>
      </div>
      <div id="fatal" hidden>
        <section class="work-card fatal-in">
          <header><img src="/ui/brand.svg" alt="" /><b>游戏运行中断</b></header>
          <pre id="fatal-text"></pre>
          <div class="menu-row">
            <button id="fatal-quit" class="primary">返回游戏库</button
            ><button id="fatal-copy">复制诊断</button><button id="fatal-download">下载诊断</button>
          </div>
        </section>
      </div>
    </section>
  </body>
</html>
